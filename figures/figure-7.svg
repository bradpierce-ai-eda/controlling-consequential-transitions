xt fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="172.5" y="734.6"><tspan x="172.5" y="725.64">No boundary →</tspan><tspan x="172.5" y="743.56">advisory policy</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="295" x2="320" y1="605" y2="605" /><rect fill="#d9ecd1" height="100" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="245" x="320" y="555" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="442.5" y="612.35"><tspan x="442.5" y="612.35">Alt. paths</tspan></text><rect fill="#eef1f4" height="88" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="245" x="320" y="685" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="442.5" y="734.6"><tspan x="442.5" y="725.64">No inventory →</tspan><tspan x="442.5" y="743.56">bypass risk</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="565" x2="590" y1="605" y2="605" /><rect fill="#d9ecd1" height="100" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="245" x="590" y="555" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="712.5" y="612.35"><tspan x="712.5" y="612.35">Effect</tspan></text><rect fill="#eef1f4" height="88" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="245" x="590" y="685" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="712.5" y="734.6"><tspan x="712.5" y="725.64">No receipt →</tspan><tspan x="712.5" y="743.56">retry ambiguity</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="835" x2="860" y1="605" y2="605" /><rect fill="#d9ecd1" height="100" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="245" x="860" y="555" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="982.5" y="612.35"><tspan x="982.5" y="612.35">Observation</tspan></text><rect fill="#eef1f4" height="88" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="245" x="860" y="685" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="982.5" y="734.6"><tspan x="982.5" y="725.64">No observation →</tspan><tspan x="982.5" y="743.56">acceptance ≠ outcome</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="1105" x2="1130" y1="605" y2="605" /><rect fill="#d9ecd1" height="100" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="245" x="1130" y="555" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="1252.5" y="612.35"><tspan x="1252.5" y="612.35">Post-state</tspan></text><rect fill="#eef1f4" height="88" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="245" x="1130" y="685" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="1252.5" y="734.6"><tspan x="1252.5" y="725.64">No commit →</tspan><tspan x="1252.5" y="743.56">world state unclear</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="1375" x2="1400" y1="605" y2="605" /><rect fill="#d9ecd1" height="100" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="245" x="1400" y="555" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" text-anchor="middle" x="1522.5" y="612.35"><tspan x="1522.5" y="612.35">Audit chain</tspan></text><rect fill="#eef1f4" height="88" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="245" x="1400" y="685" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" text-anchor="middle" x="1522.5" y="734.6"><tspan x="1522.5" y="725.64">No chain →</tspan><tspan x="1522.5" y="743.56">guesswork</tspan></text><text fill="#5c6b7c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" x="800" y="865"><tspan x="800" y="865.0">Use the map to distinguish native semantics, external semantics, and application convention.</tspan></text></svg>