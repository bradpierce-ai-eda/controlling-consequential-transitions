ill="#d9e8f6" height="125" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="195" x="875" y="335" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="972.5" y="405.9"><tspan x="972.5" y="405.9">Execute</tspan></text><line fill="none" stroke="#1f416d" stroke-width="3" x1="1070" x2="1140" y1="397.5" y2="397.5" /><rect fill="#d9ecd1" height="125" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="195" x="1140" y="335" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="1237.5" y="405.9"><tspan x="1237.5" y="405.9">Observe</tspan></text><line fill="none" stroke="#1f416d" stroke-width="3" x1="1335" x2="1405" y1="397.5" y2="397.5" /><rect fill="#d9ecd1" height="125" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="195" x="1405" y="335" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" x="1502.5" y="405.9"><tspan x="1502.5" y="405.9">Commit</tspan></text><rect fill="#eef1f4" height="110" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="320" x="475" y="105" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="635.0" y="166.65"><tspan x="635.0" y="156.01">Stale human approval</tspan><tspan x="635.0" y="177.29">→ revalidate state</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="635" x2="707.5" y1="215" y2="335" /><rect fill="#eef1f4" height="110" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="330" x="930" y="105" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" text-anchor="middle" x="1095.0" y="166.65"><tspan x="1095.0" y="156.01">Duplicate retry</tspan><tspan x="1095.0" y="177.29">→ replay / idempotency</tspan></text><line fill="none" marker-end="url(#arrow_light)" stroke="#c7d0d9" stroke-width="2.5" x1="1095" x2="972.5" y1="215" y2="335" /><rect fill="#f2d4d4" height="115" rx="20" ry="20" stroke="#c9817e" stroke-width="2.5" width="280" x="135" y="575" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="275.0" y="638.45"><tspan x="275.0" y="628.9300000000001">Stale evidence</tspan><tspan x="275.0" y="647.97">→ refresh / re-evaluate</tspan></text><line fill="none" stroke="#c9817e" stroke-width="2.5" x1="177.5" x2="275.0" y1="460" y2="575" /><rect fill="#f2d4d4" height="115" rx="20" ry="20" stroke="#c9817e" stroke-width="2.5" width="280" x="575" y="575" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="715.0" y="638.45"><tspan x="715.0" y="628.9300000000001">Expired / revoked</tspan><tspan x="715.0" y="647.97">→ reject / re-evaluate</tspan></text><line fill="none" stroke="#c9817e" stroke-width="2.5" x1="707.5" x2="715.0" y1="460" y2="575" /><rect fill="#f2d4d4" height="115" rx="20" ry="20" stroke="#c9817e" stroke-width="2.5" width="280" x="865" y="575" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1005.0" y="638.45"><tspan x="1005.0" y="628.9300000000001">Ambiguous effect</tspan><tspan x="1005.0" y="647.97">→ reconcile before retry</tspan></text><line fill="none" stroke="#c9817e" stroke-width="2.5" x1="972.5" x2="1005.0" y1="460" y2="575" /><rect fill="#f2d4d4" height="115" rx="20" ry="20" stroke="#c9817e" stroke-width="2.5" width="300" x="1160" y="575" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle" x="1310.0" y="638.45"><tspan x="1310.0" y="628.9300000000001">Observation unavailable</tspan><tspan x="1310.0" y="647.97">→ uncertain / reconciling</tspan></text><line fill="none" stroke="#c9817e" stroke-width="2.5" x1="1237.5" x2="1310.0" y1="460" y2="575" /><text fill="#5c6b7c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" x="800" y="815"><tspan x="800" y="815.0">The transition contract is defined as much by what it refuses to commit under uncertainty as by its normal path.</tspan></text></svg>