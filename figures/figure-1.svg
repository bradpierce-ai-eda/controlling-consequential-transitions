<svg baseProfile="full" height="914px" version="1.1" viewBox="0 0 1600 914" width="1600px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f416d" /></marker><marker id="arrow_light" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c7d0d9" /></marker></defs><rect id="bg-white" x="0" y="0" width="100%" height="100%" fill="#ffffff" /><text fill="#1f416d" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" x="48" y="66">Figure 1. Six signs the consequential transition is still implicit</text><rect fill="#ffffff" height="180" rx="20" ry="20" stroke="#1f416d" stroke-width="3" width="420" x="590" y="365" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" text-anchor="middle" x="800.0" y="466.9"><tspan x="800.0" y="447.85999999999996">CONSEQUENTIAL</tspan><tspan x="800.0" y="485.93999999999994">TRANSITION</tspan></text><rect fill="#eef1f4" height="155" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="430" x="80" y="150" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="295.0" y="235.9"><tspan x="295.0" y="222.46">Boolean approval</tspan><tspan x="295.0" y="249.34">No durable grant</tspan></text><rect fill="#d9e8f6" height="155" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="430" x="585" y="125" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="800.0" y="210.9"><tspan x="800.0" y="197.46">Actor claim accepted</tspan><tspan x="800.0" y="224.34">as sufficient evidence</tspan></text><rect fill="#eef1f4" height="155" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="430" x="1090" y="150" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="1305.0" y="235.9"><tspan x="1305.0" y="222.46">Approval detached from</tspan><tspan x="1305.0" y="249.34">object / state</tspan></text><rect fill="#d9e8f6" height="155" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="430" x="80" y="595" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="295.0" y="680.9"><tspan x="295.0" y="667.4599999999999">Policy can be bypassed</tspan><tspan x="295.0" y="694.3399999999999">by alternate effect path</tspan></text><rect fill="#eef1f4" height="155" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="430" x="585" y="630" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="800.0" y="715.9"><tspan x="800.0" y="702.4599999999999">Request acceptance</tspan><tspan x="800.0" y="729.3399999999999">≠ observed outcome</tspan></text><rect fill="#d9e8f6" height="155" rx="20" ry="20" stroke="#c7d0d9" stroke-width="2.5" width="430" x="1090" y="595" /><text fill="#19232f" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" text-anchor="middle" x="1305.0" y="680.9"><tspan x="1305.0" y="667.4599999999999">Audit requires</tspan><tspan x="1305.0" y="694.3399999999999">timestamp correlation</tspan></text><line fill="none" stroke="#c7d0d9" stroke-width="2.5" x1="295" x2="670" y1="305" y2="405" /><line fill="none" stroke="#c7d0d9" stroke-width="2.5" x1="800" x2="800.0" y1="280" y2="365" /><line fill="none" stroke="#c7d0d9" stroke-width="2.5" x1="1305" x2="930" y1="305" y2="405" /><line fill="none" stroke="#c7d0d9" stroke-width="2.5" x1="295" x2="670" y1="595" y2="530" /><line fill="none" stroke="#c7d0d9" stroke-width="2.5" x1="800" x2="800.0" y1="630" y2="545" /><line fill="none" stroke="#c7d0d9" stroke-width="2.5" x1="1305" x2="930" y1="595" y2="530" /><text fill="#5c6b7c" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" text-anchor="middle" x="800" y="845"><tspan x="800" y="845.0">These are symptoms of missing transition semantics — not defects in any particular product.</tspan></text></svg>